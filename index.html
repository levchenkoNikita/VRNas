<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRNas</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>

<body>
    <header class="header">
        <div class="header__inner container">
            <!-- Логотип -->
            <a href="#" class="header__logo logo">
                <img src="/images/logo.png" alt="VRNas - логотип сайта" class="header__logo-image" width="101"
                    height="30">
            </a>
            <!-- Меню -->
            <nav class="header__menu" data-js-header-menu>
                <ul class="header__list">
                    <li class="header__item">
                        <a href="#" class="header__link is-current">
                            <span class="header__link-text">Home</span>
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">
                            <span class="header__link-text">About us</span>
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">
                            <span class="header__link-text">Service</span>
                        </a>
                    </li>
                    <!-- Альтернативные ссылки ниже -->
                    <li class="header__item">
                        <div class="header__link select-link" data-js-header-select>
                            <button class="select-link__button" data-js-header-select-button>
                                <span class="select-link__button-text">Page</span>
                                <span class="select-link__button-arrow">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M6 7.68789L3 4.68789L3.5375 4.15039L6 6.62539L8.4625 4.16289L9 4.70039L6 7.68789Z"
                                            fill="white" />
                                    </svg>
                                </span>
                            </button>
                            <!-- Ниже указан список ссылок для выбора -->
                            <ul class="select-link__list" data-js-header-select-list>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Pricing Plan</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">FAQ</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Tems & Conditions</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Privacy Policy</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li class="header__item">
                        <div class="header__link select-link" data-js-header-select>
                            <button class="select-link__button" data-js-header-select-button>
                                <span class="select-link__button-text">Page</span>
                                <span class="select-link__button-arrow">
                                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M6 7.68789L3 4.68789L3.5375 4.15039L6 6.62539L8.4625 4.16289L9 4.70039L6 7.68789Z"
                                            fill="white" />
                                    </svg>
                                </span>
                            </button>
                            <!-- Ниже указан список ссылок для выбора -->
                            <ul class="select-link__list" data-js-header-select-list>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Pricing Plan</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">FAQ</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Tems & Conditions</span>
                                    </a>
                                </li>
                                <li class="select-link__item">
                                    <a href="#" class="select-link__option">
                                        <span class="select-link__option-text">Privacy Policy</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>
            <!-- Кнопка -->
            <button class="header__button button button--transparent">
                <span class="header__button-text">Contact Us</span>
            </button>
        </div>
    </header>

    <script src="./scripts/main.js" type="module"></script>
</body>

</html>
