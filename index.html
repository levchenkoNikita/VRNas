<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRNas</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>

<body>
    <header class="header">
        <div class="header__inner container">
            <!-- Логотип -->
            <a href="#" class="header__logo logo">
                <img src="/images/logo.png" alt="VRNas - логотип сайта" class="header__logo-image" width="101"
                    height="30">
            </a>
            <!-- Меню -->
            <nav class="header__menu">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="#" class="header__link is-hover">
                            <span class="header__link-text">Home</span>
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">
                            <span class="header__link-text">About us</span>
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#" class="header__link">
                            <span class="header__link-text">Service</span>
                        </a>
                    </li>
                    <!-- Альтернативные ссылки ниже -->
                    <li class="header__item">
                        <div class="header__link header__link-select">
                            <span class="header__link-text">Page</span>
                            <span class="header__link-arrow">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M6 7.68789L3 4.68789L3.5375 4.15039L6 6.62539L8.4625 4.16289L9 4.70039L6 7.68789Z"
                                        fill="white" />
                                </svg>
                            </span>
                            <!-- Ниже указан список ссылок для выбора -->
                            <ul class="header__link-list">
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Pricing Plan</span>
                                    </a>
                                </li>
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">FAQ</span>
                                    </a>
                                </li>
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Tems & Conditions</span>
                                    </a>
                                </li>
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Privacy Policy</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>
                    <li class="header__item">
                        <div class="header__link header__link-select">
                            <span class="header__link-text">Blog</span>
                            <span class="header__link-arrow">
                                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M6 7.68789L3 4.68789L3.5375 4.15039L6 6.62539L8.4625 4.16289L9 4.70039L6 7.68789Z"
                                        fill="white" />
                                </svg>
                            </span>
                            <!-- Ниже указан список ссылок для выбора -->
                            <ul class="header__link-list">
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Resent articles</span>
                                    </a>
                                </li>
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Our Team</span>
                                    </a>
                                </li>
                                <li class="header__link-item">
                                    <a href="#" class="header__link-option">
                                        <span class="header__link-option-text">Detail Service</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>
            <!-- Кнопка -->
            <button class="header__button button button--transparent">
                <span class="header__button-text">Contact Us</span>
            </button>
        </div>
    </header>
</body>

</html>
